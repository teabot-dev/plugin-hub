[project]
name = "teabot-plugin-hub"
version = "0.1.0"
description = "The tools that check plugins submitted to the teabot plugin hub, and build its catalogue."
requires-python = ">=3.12"
dependencies = ["teabot>=1.3"]

[project.scripts]
hub-check = "hub.check:main"
hub-catalogue = "hub.catalogue:main"

[dependency-groups]
dev = ["pytest>=9.2", "ruff>=0.17", "pyright>=1.1.414"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hub"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["hub", "tests"]
