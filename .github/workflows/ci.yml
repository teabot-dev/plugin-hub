name: Tools
# The hub's own tools: lint, types and tests.
on:
  push:
    branches: [main]
    paths-ignore: ["plugins/**"]
  pull_request:
    paths-ignore: ["plugins/**"]

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest -q
