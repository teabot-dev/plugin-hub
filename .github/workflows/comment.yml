name: Comment the report
# Posts check.yml's report on its pull request. It runs no code from the pull request: it reads two files, the
# pull request's number and the report, and checks the number is one.
on:
  workflow_run:
    workflows: ["Check listings"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          number=$(cat number)
          case "$number" in (*[!0-9]*|"") echo "not a pull request number"; exit 1;; esac
          gh pr comment "$number" --repo "$REPO" --body-file report.md --edit-last \
            || gh pr comment "$number" --repo "$REPO" --body-file report.md
